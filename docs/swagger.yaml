basePath: /api/v1
definitions:
  dtos.CreateCustomerDTO:
    properties:
      address:
        type: string
      city:
        type: string
      complement:
        type: string
      email:
        type: string
      name:
        type: string
      neighborhood:
        type: string
      number:
        type: string
      paymentDay:
        example: 10
        maximum: 31
        minimum: 1
        type: integer
      phone:
        type: string
      state:
        type: string
      zipCode:
        type: string
    required:
    - address
    - city
    - email
    - name
    - neighborhood
    - number
    - paymentDay
    - phone
    - state
    - zipCode
    type: object
  dtos.CreateProductDTO:
    properties:
      description:
        type: string
      price:
        example: 10.5
        type: number
    type: object
  dtos.CreatePurchaseDTO:
    properties:
      date:
        example: "2025-10-13"
        type: string
      paymentDate:
        example: "2025-10-13"
        type: string
      products:
        items:
          properties:
            id:
              type: integer
            quantity:
              minimum: 1
              type: integer
          required:
          - id
          - quantity
          type: object
        minItems: 1
        type: array
    required:
    - date
    - products
    type: object
  dtos.EditCustomerDTO:
    properties:
      address:
        type: string
      city:
        type: string
      complement:
        type: string
      email:
        type: string
      name:
        type: string
      neighborhood:
        type: string
      number:
        type: string
      paymentDay:
        example: 10
        maximum: 31
        minimum: 1
        type: integer
      phone:
        type: string
      state:
        type: string
      zipCode:
        type: string
    required:
    - address
    - city
    - email
    - name
    - neighborhood
    - number
    - paymentDay
    - phone
    - state
    - zipCode
    type: object
  dtos.EditProductDTO:
    properties:
      description:
        type: string
      price:
        example: 10.5
        type: number
    type: object
  dtos.EditPurchaseDTO:
    properties:
      date:
        example: "2025-10-13"
        type: string
    required:
    - date
    type: object
  models.Customer:
    properties:
      address:
        type: string
      city:
        type: string
      complement:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      neighborhood:
        type: string
      number:
        type: string
      paymentDay:
        type: integer
      phone:
        type: string
      state:
        type: string
      updatedAt:
        type: string
      zipCode:
        type: string
    type: object
  models.CustomerPendingPayment:
    properties:
      createdAt:
        type: string
      date:
        type: string
      id:
        type: integer
      totalPrice:
        type: number
      updatedAt:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.PaginatedResponse-models_Customer:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Customer'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  models.PaginatedResponse-models_Product:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Product'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  models.PaginatedResponse-models_Purchase:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Purchase'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  models.Product:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      price:
        type: number
      updatedAt:
        type: string
    type: object
  models.Purchase:
    properties:
      createdAt:
        type: string
      customerId:
        type: integer
      date:
        type: string
      id:
        type: integer
      paymentDate:
        type: string
      products:
        items:
          properties:
            description:
              type: string
            id:
              type: integer
            price:
              type: number
            quantity:
              type: integer
          type: object
        type: array
      totalPrice:
        type: number
      updatedAt:
        type: string
    type: object
